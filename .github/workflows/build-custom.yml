name: "Build Custom OpenWrt Installer ISO"

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '请输入下载地址(扩展名 .img.gz/.img.xz/.img.zip)'
        required: true
        default: 'https://default.example.com/file.img.gz'
      publish:
        description: '是否创建或更新 GitHub Release'
        required: false
        default: true
        type: boolean

# Release 上传需要写权限；仓库若采用只读默认权限，显式声明可避免 403。
permissions:
  contents: write


jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"
    env:
      DOWNLOAD_URL: ${{ inputs.download_url }}

    steps:
      - name: "Checking out git repository"
        uses: actions/checkout@v7.0.1

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/custom.sh"
          chmod +x "${{ github.workspace }}/supportFiles/custom/build.sh"

      - name: Validate Download URL
        run: |
          DEFAULT_URL="https://default.example.com/file.img.gz"
          
          if [[ "$DOWNLOAD_URL" == "$DEFAULT_URL" ]]; then
            echo "❌ 错误：请修改默认下载地址！当前地址为无效占位符。"
            exit 1
          fi
          
          if [[ ! "$DOWNLOAD_URL" =~ ^https?://[^[:space:]]+\.(gz|xz|zip)(\?[^[:space:]]*)?$ ]]; then
            echo "❌ 错误：地址需以 http(s) 开头且扩展名为 .gz/.xz/.zip"
            echo "当前输入：$DOWNLOAD_URL"
            exit 1
          fi

      - name: "Build Image"
        run: |
          bash ./custom.sh "$DOWNLOAD_URL"

      - name: "Add upstream version to ISO filename"
        run: bash ./scripts/versioned-iso.sh output/custom-installer-x86_64.iso "$DOWNLOAD_URL"

      - name: "Publish"
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "Custom-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/supportFiles/custom/info.md"
          files: |
            output/*.iso
          token: "${{ secrets.GITHUB_TOKEN }}"

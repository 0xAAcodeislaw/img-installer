name: "Build eSirOpenWrt Installer ISO"

on:
 workflow_dispatch:
   inputs:
     publish:
       description: "是否创建或更新 GitHub Release"
       required: false
       default: true
       type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"

    steps:
      - name: "Get Date"
        run: |
          echo "DATESTAMP=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: "Checking out git repository"
        uses: actions/checkout@v7.0.1
      
      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/esir.sh"
          chmod +x "${{ github.workspace }}/supportFiles/esirplayground/build.sh"

      - name: "Build Image"
        run: |
          ./esir.sh
      
      - name: "Add upstream version to ISO filename"
        run: bash ./scripts/versioned-iso.sh output/esiropenwrt-installer-x86_64.iso "$ESIR_SELECTED_ASSET"

      - name: "Publish"
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "eSirOpenWrt-Installer-x86_64-ISO"
          body_path: ${{ github.workspace }}/supportFiles/esirplayground/info.md
          files: |
            output/*.iso
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

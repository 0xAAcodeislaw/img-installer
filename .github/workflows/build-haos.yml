name: "Build HAOS Installer ISO"

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '输入 latest 自动选择最新 HAOS；或填写直链(.img.gz/.img.xz/.img.zip)'
        required: true
        default: 'latest'
      publish:
        description: '是否创建或更新 GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"
    env:
      DOWNLOAD_URL: ${{ inputs.download_url }}

    steps:
      - name: "Checking out git repository"
        uses: actions/checkout@v7.0.1

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/haos.sh"
          chmod +x "${{ github.workspace }}/supportFiles/haos/build.sh"

      - name: Validate Download URL
        run: |
          if [[ "$DOWNLOAD_URL" != "latest" && ! "$DOWNLOAD_URL" =~ ^https?://[^[:space:]]+\.(gz|xz|zip)(\?[^[:space:]]*)?$ ]]; then
            echo "❌ 错误：请输入 latest，或提供以 http(s) 开头且扩展名为 .gz/.xz/.zip 的地址"
            echo "当前输入：$DOWNLOAD_URL"
            exit 1
          fi

      - name: "Build Image"
        run: |
          bash ./haos.sh "$DOWNLOAD_URL"

      - name: Report selected upstream firmware
        if: ${{ always() }}
        run: |
          {
            echo "### 上游 HAOS 固件"
            echo "- Release: \`${HAOS_SELECTED_RELEASE:-manual}\`"
            echo "- Asset: \`${HAOS_SELECTED_ASSET:-$DOWNLOAD_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Add upstream version to ISO filename"
        run: bash ./scripts/versioned-iso.sh output/haos-installer-x86_64.iso "${HAOS_SELECTED_ASSET:-$DOWNLOAD_URL}"

      - name: "Publish"
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "HAOS-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/supportFiles/haos/info.md"
          files: |
            output/*.iso
          token: "${{ secrets.GITHUB_TOKEN }}"

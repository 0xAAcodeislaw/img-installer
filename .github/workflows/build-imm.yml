name: "Build ImmortalWrt Installer ISO"

on:
 workflow_dispatch:
   inputs:
     upstream_version:
       description: "ImmortalWrt 版本；latest 自动选择上游 x86-64 EFI 固件"
       required: true
       default: "latest"
     publish:
       description: "是否创建或更新 GitHub Release"
       required: false
       default: true
       type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"
    env:
      IMMORTALWRT_VERSION: ${{ inputs.upstream_version }}

    steps:
      - name: "Get Date"
        run: |
          echo "DATESTAMP=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: "Checking out git repository"
        uses: actions/checkout@v4
      
      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/imm.sh"
          chmod +x "${{ github.workspace }}/supportFiles/immortalwrt/build.sh"

      - name: "Build Image"
        run: |
          bash ./imm.sh
      
      - name: "Publish"
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "ImmortalWrt-Installer-x86_64-ISO"
          body_path: ${{ github.workspace }}/supportFiles/immortalwrt/info.md
          files: |
            output/immortalwrt-installer-x86_64.iso
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "Build iStoreOS Installer ISO"

on:
 workflow_dispatch:
   inputs:
     upstream_release:
       description: "上游 Release 标签；latest 自动选择最新 iStoreOS x86-64 固件"
       required: true
       default: "latest"
     publish:
       description: "是否创建或更新 GitHub Release"
       required: false
       default: true
       type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: "Build and Release"
    runs-on: "ubuntu-22.04"
    env:
      ISTOREOS_RELEASE: ${{ inputs.upstream_release }}

    steps:

      - name: "Checking out git repository"
        uses: actions/checkout@v7.0.1
      
      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/istoreos.sh"
          chmod +x "${{ github.workspace }}/supportFiles/istoreos/build.sh"

      - name: "Build iStoreOS Installer ISO"
        run: |
          bash ./istoreos.sh
      
      - name: "Add upstream version to ISO filename"
        run: bash ./scripts/versioned-iso.sh output/istoreos-installer-x86_64.iso "$ISTOREOS_SELECTED_ASSET"

      - name: "Publish"
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "iStoreOS-Installer-x86_64-ISO"
          body_path: ${{ github.workspace }}/supportFiles/istoreos/info.md
          files: |
            output/*.iso
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
